# ⚠️ DOCUMENTATION MIRROR — NOT the source of truth.
# This Render project is managed manually in the Render dashboard (project
# "PackLox"), NOT provisioned from this file. Service names, the web service's
# Docker runtime, and the full secret set live in the dashboard. Keep this file
# in sync by hand as a readable spec; editing it does NOT change Render.
#
# Live services (dashboard):
#   packlox-api-sit                          web  (Docker)   — FastAPI app
#   collectiq-pricecharting-refresh-sit      cron (Python 3) — daily catalog refresh
#   packlox-batch-reprice-sit                cron (Python 3) — daily batch re-pricing
#   packlox-price-alerts-sit                 cron (Python 3) — 6-hourly alert pipeline
#   packlox-catalog-promote-scan-derived-sit cron (Python 3) — daily scan-derived catalog promotion
#   packlox-discover-pricecharting-sets-sit  cron (Python 3) — weekly comics/coins/sports-cards set discovery
#   packlox-backfill-pricecharting-sets-sit  cron (Python 3) — comics/coins/sports-cards catalog backfill
#   packlox-match-portfolio-catalog-sit      cron (Python 3) — hourly portfolio-item-to-catalog linking
#
# The three app-facing crons call the deployed web service over HTTP (so all
# the pricing / Supabase / Firebase secrets live only on packlox-api-sit and
# are not duplicated per-cron). packlox-batch-reprice-sit and
# packlox-price-alerts-sit need ADMIN_JOB_TOKEN;
# packlox-catalog-promote-scan-derived-sit needs ADMIN_IMPORT_TOKEN instead —
# its endpoint reuses the same auth dependency as /admin/pricecharting/import,
# not the job-token one the other two use.

services:
  - type: web
    name: packlox-api-sit
    # Live runtime is Docker (has a Dockerfile); shown as python here only for
    # the env reference below.
    runtime: python
    plan: starter
    region: oregon
    branch: main
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: ENVIRONMENT
        value: sit
      - key: APP_VERSION
        value: 0.1.0
      - key: COMMIT_SHA
        sync: false
      - key: BUILD_TIME
        sync: false
      - key: PUBLIC_API_URL
        value: https://api-sit.packlox.com
      - key: PUBLIC_FRONTEND_URL
        value: https://sit.packlox.com
      - key: CORS_ALLOWED_ORIGINS
        value: https://sit.packlox.com,https://admin.packlox.com,https://packlox-admin-portal.hariomritesh.workers.dev,http://localhost:8000,http://127.0.0.1:8000,http://localhost:3000,http://127.0.0.1:3000
      - key: HEALTH_TIMEOUT_SECONDS
        value: "3"
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_HEALTH_REQUIRED
        value: "true"
      - key: AI_PROVIDER
        value: auto
      # Set to "auto" (with a real pricing key below) for live market values;
      # "mock" makes every valuation come back unavailable.
      - key: PRICING_PROVIDER
        value: auto
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-3.6-flash
      - key: GEMINI_TIMEOUT_SECONDS
        value: "30"
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        value: gpt-4.1-mini
      - key: OPENAI_TIMEOUT_SECONDS
        value: "30"
      - key: PRICING_CACHE_TTL_SECONDS
        value: "900"
      - key: PRICING_PROVIDER_MIN_INTERVAL_MS
        value: "250"
      # Real pricing providers (auto routes by category → tcgplayer/pricecharting
      # /ebay for cards, kicksdb for sneakers). TCGPLAYER_* is not configured;
      # cards fall back to PriceCharting + eBay.
      - key: PRICECHARTING_API_KEY
        sync: false
      - key: EBAY_ACCESS_TOKEN
        sync: false
      - key: EBAY_CLIENT_ID
        sync: false
      - key: EBAY_CLIENT_SECRET
        sync: false
      - key: EBAY_OAUTH_TOKEN_URL
        sync: false
      - key: EBAY_BROWSE_API_URL
        sync: false
      - key: EBAY_MARKETPLACE_ID
        sync: false
      - key: EBAY_TIMEOUT_SECONDS
        sync: false
      - key: KICKSDB_API_KEY
        sync: false
      - key: KICKSDB_API_BASE
        sync: false
      - key: KICKSDB_PROVIDER_ENABLED
        sync: false
      # Push (price-alert dispatch runs here when the alerts cron calls the API).
      - key: FIREBASE_PROJECT_ID
        sync: false
      - key: FIREBASE_SERVICE_ACCOUNT_JSON
        sync: false
      # Admin auth: crons authenticate to the /admin endpoints with this token.
      - key: ADMIN_IMPORT_TOKEN
        sync: false
      - key: ADMIN_JOB_TOKEN
        sync: false
      - key: ADMIN_PROFILE_TABLE
        value: profiles
      - key: PRICECHARTING_CSV_VIDEO_GAMES_URL
        sync: false
      - key: PRICECHARTING_CSV_POKEMON_URL
        sync: false
      - key: PRICECHARTING_CSV_MAGIC_URL
        sync: false
      - key: PRICECHARTING_CSV_YUGIOH_URL
        sync: false
      - key: PRICECHARTING_CSV_ONE_PIECE_URL
        sync: false

  - type: cron
    name: collectiq-pricecharting-refresh-sit
    runtime: python
    plan: starter
    region: oregon
    branch: main
    schedule: "30 14 * * *"
    buildCommand: pip install -r requirements.txt
    startCommand: python -m scripts.refresh_pricecharting_catalog --batch-size 1000 --timeout-seconds 600 --sleep-between-sources-seconds 600
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: ENVIRONMENT
        value: sit
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: PRICECHARTING_CSV_VIDEO_GAMES_URL
        sync: false
      - key: PRICECHARTING_CSV_POKEMON_URL
        sync: false
      - key: PRICECHARTING_CSV_MAGIC_URL
        sync: false
      - key: PRICECHARTING_CSV_YUGIOH_URL
        sync: false
      - key: PRICECHARTING_CSV_ONE_PIECE_URL
        sync: false

  # Discovers Comics/Coins/Sports-Cards set pages (categories the bulk CSV
  # pipeline above doesn't cover) and registers new ones in
  # pricecharting_set_registry for the priority-ordered backfill worker to
  # pick up. Cheap plain-HTML crawl (not the rate-limited CSV/API endpoints),
  # existing rows are never touched on re-run. Weekly, not monthly: sports
  # cards get new product releases fairly often through the year, and a
  # missed set just sits unpriced until the next crawl finds it.
  # region: ohio -- sportscardspro.com's Cloudflare protection blocks even
  # plain page views (not just the CSV/console_uid endpoints) from Render's
  # Oregon outbound IP with a 403, live-confirmed 2026-08-09. The backfill
  # cron below was already migrated Oregon->Ohio for the same reason (see
  # its own comment); this discovery cron needs the identical migration --
  # Render has no in-place region change, a new service must be created in
  # Ohio and the old Oregon one retired, same as was done for backfill.
  - type: cron
    name: packlox-discover-pricecharting-sets-sit
    runtime: python
    plan: starter
    region: ohio
    branch: main
    schedule: "0 3 * * 0"
    buildCommand: pip install -r requirements.txt
    startCommand: python -m scripts.discover_pricecharting_sets
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: ENVIRONMENT
        value: sit
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false

  # Backfills Comics/Coins/Sports-Cards catalog data: claims priority-ordered
  # rows from pricecharting_set_registry, resolves each set's console_uid,
  # batches many sets into one undocumented-but-confirmed-working
  # /price-guide/download-custom request, and writes straight into the same
  # pricecharting_catalog / pricecharting_catalog_history tables the existing
  # 5 bulk categories use (via the same SCD2 upsert code) -- so backfilled
  # items are immediately usable by search/matching/pricing, not just landed
  # as raw files. Runs frequently since each run is self-paced (2s between
  # requests) and only processes a bounded --limit of registry rows.
  #
  # --batch-size 300 (up from 150 on 2026-08-09): sets per download-custom
  # request for pricecharting.com (comics/coins) -- unlike sportscardspro's
  # --sportscardspro-batch-size (deliberately tiny, see below, due to a
  # real OOM crash from oversized vintage sports-card sets), comics/coins
  # sets average far fewer items each (~41/set for comics, vs. 1,300+/set
  # for the sportscardspro sets that caused that crash), so there's real
  # headroom here. Catalog writes are chunked independently at
  # --catalog-batch-size regardless of this value, so raising it doesn't
  # reintroduce the Postgres statement-timeout issue either. Not pushed
  # further than 2x yet since this hasn't been live-tested at a higher
  # value -- same pacing philosophy as everything else changed today.
  #
  # --console-resolve-concurrency 8 (up from 4 on 2026-08-09): the
  # console_uid resolve phase (one plain page fetch per unresolved set)
  # dominates a run's wall clock -- confirmed live at ~5min of pure pacing
  # for 150 sets serially. N shards the claimed rows round-robin across N
  # threads, each still pacing at --sleep-between-requests-seconds
  # independently -- same per-lane request rate as before, ~Nx less wall
  # clock. This only affects pricecharting.com rows (comics/coins here --
  # sportscardspro.com console_uid resolution has its own separate,
  # much-more-cautious pacing/concurrency, see below), and
  # pricecharting.com is confirmed to have NO Cloudflare throttle at all
  # (unlike sportscardspro.com) -- months of runs at 4 with zero issues,
  # so raising this specific lever carries none of the burst-rate risk
  # that broke sportscardspro's API-search concurrency (see below). Not
  # pushed higher than 8 yet purely out of caution about Postgres/Supabase
  # write-side load (see --catalog-batch-size), not about the fetch side.
  #
  # --sportscardspro-slow-path-limit 40 (scaled back from 45 on
  # 2026-08-09, same day): SPORTSCARDSPRO_DEFAULT_SLEEP_SECONDS dropped
  # from 30s to 10s and this limit was raised from 24 to 45 based on a
  # short (8-request) live test from this cron's own Ohio region -- but
  # after roughly an hour of sustained cron cycles at the new pace, 429s
  # started recurring. A short burst test can confirm request-rate safety;
  # it can't reveal a longer-window/aggregate volume limit, which only
  # shows up under sustained real traffic. Backed pacing off to 15s (see
  # SPORTSCARDSPRO_DEFAULT_SLEEP_SECONDS) and this limit to 40 -- together
  # landing at roughly 2x the original pre-2026-08-09 throughput (30s/24)
  # instead of the ~3x that triggered the recurring 429s, while still
  # meaningfully faster than where this started the day.
  #
  # --sportscardspro-api-search-sleep-seconds 1.0 (scaled back from 0.5 on
  # 2026-08-09, same day): same reasoning as above -- 0.5s tested clean in
  # a short live burst but contributed to the same recurring-429s pattern
  # once sustained over an hour alongside the slow-path changes. 1.0s is
  # roughly 2x the original 2s baseline (this step used to inherit
  # --sleep-between-requests-seconds before it got its own flag), not the
  # ~4x that 0.5s represented.
  #
  # --sportscardspro-api-search-concurrency 1 (NOT 4): concurrency was
  # tried at 4 (round-robin lanes, same design as --console-resolve-
  # concurrency) on the theory that individual searches vary widely in
  # latency and overlapping them would help -- but live-confirmed
  # 2026-08-09 that 4 parallel lanes each independently pacing at 0.5s
  # produces real request BURSTS well above the validated serial rate when
  # the lanes' timers align, and this DID trip a real Cloudflare 429 cascade
  # in production (circuit breaker caught it correctly, no data loss, but
  # the burst was real). A block also appeared to bleed into the separate
  # slow-path console_uid resolve step immediately after, suggesting
  # sportscardspro.com's throttle isn't perfectly isolated per-function
  # once tripped. Reverted to 1 (serial, unchanged from original behavior)
  # -- do not raise this again without a much more cautious, gradual test.
  #
  # --catalog-batch-size 25 (down from 50 on 2026-08-09): the pacing/limit
  # increases above roughly tripled how much data a single run can fetch,
  # which pushed the catalog UPSERT step (a hash lookup plus a conflict
  # -resolving write per row -- already known to hit Postgres's statement
  # timeout at a much lower row count than a plain insert) into hitting
  # that timeout on some sub-batches, live-confirmed in production logs
  # ("canceling statement due to statement timeout", HTTP 500). Already
  # handled safely either way (PartialCatalogWriteError catches it and
  # retries the failed rows next cycle, no data loss) -- this just reduces
  # how often it happens by keeping each write sub-batch smaller.
  - type: cron
    name: packlox-backfill-pricecharting-sets-sit
    runtime: python
    plan: starter
    region: oregon
    branch: main
    schedule: "*/15 * * * *"
    buildCommand: pip install -r requirements.txt
    startCommand: python -m scripts.backfill_pricecharting_sets --limit 150 --batch-size 300 --catalog-batch-size 25 --sleep-between-requests-seconds 2 --console-resolve-concurrency 8 --sportscardspro-slow-path-limit 40 --sportscardspro-api-search-sleep-seconds 1.0 --sportscardspro-api-search-concurrency 1
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: ENVIRONMENT
        value: sit
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: PRICECHARTING_API_TOKEN
        sync: false

  # Refreshes individually-tracked comics/coins/sports-cards/lorcana/funko/
  # lego catalog items via /api/product?id=X (one call per item), the piece
  # the backfill cron above doesn't cover -- claim_rows() there permanently
  # excludes already-succeeded sets, so a tracked item's price otherwise
  # never updates again after its one-time backfill, and its SCD2 history /
  # portfolio detail chart never accumulates new points. The 5 bulk
  # categories (video games, Pokemon, Magic, YuGiOh, One Piece) don't need
  # this -- their full catalog already refreshes daily via CSV -- so this
  # script explicitly excludes those source_files. Hourly, not every 15min
  # like backfill: refresh only matters for items someone actually tracks,
  # a much smaller and slower-moving population than full-set backfill.
  - type: cron
    name: packlox-refresh-tracked-catalog-items-sit
    runtime: python
    plan: starter
    region: ohio
    branch: main
    schedule: "20 * * * *"
    buildCommand: pip install -r requirements.txt
    startCommand: python -m scripts.refresh_tracked_catalog_items --limit 200 --stale-after-hours 24 --sleep-between-requests-seconds 1.5
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: ENVIRONMENT
        value: sit
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: PRICECHARTING_API_TOKEN
        sync: false

  # Refreshes small (<100-item) sets via /api/products search, regardless of
  # tracking status -- the other half of the tiered refresh design, tier 1.
  # A backfilled set never gets touched again by the backfill cron above
  # (claim_rows() permanently excludes success rows), so without this an
  # untracked item just sits frozen at its one-time backfill snapshot
  # forever. This only refreshes sets that fit under PriceCharting's 100-
  # result search cap in one call -- large sets stay on the slow CSV/
  # console_uid path, untouched by this script. Hourly at :40 (offset from
  # backfill's */15 and tracked-item-refresh's :20) to spread load in time,
  # not because it needs to be that frequent.
  - type: cron
    name: packlox-refresh-small-sets-sit
    runtime: python
    plan: starter
    region: ohio
    branch: main
    schedule: "40 * * * *"
    buildCommand: pip install -r requirements.txt
    startCommand: python -m scripts.refresh_small_sets --limit 300 --stale-after-hours 24 --sleep-between-requests-seconds 1.2
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: ENVIRONMENT
        value: sit
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: PRICECHARTING_API_TOKEN
        sync: false

  # Refreshes the KicksDB StockX sneaker catalog daily -- re-runs the same
  # 10 segments (general top-1,000-by-rank + the 9 brands that each
  # independently hit the 1,000-result cap) the initial 9,062-item backfill
  # used, now persisted as DEFAULT_SEGMENTS in the script itself instead of
  # a one-off --segments-json override. The script is idempotent either way
  # (kicksdb_catalog upsert + kicksdb_catalog_history sync both diff on
  # content_hash and only touch rows that actually changed), so running it
  # daily is what keeps current prices fresh AND accumulates real price
  # history in kicksdb_catalog_history from here on, rather than only at
  # backfill time. Daily matches KicksDB's own data refresh ceiling (their
  # docs state data updates at most every 12-24h, so polling faster buys
  # nothing). Costs ~100 requests/run (~3,000/month) -- well inside the Pro
  # plan's 250,000/month budget.
  - type: cron
    name: packlox-refresh-kicksdb-catalog-sit
    runtime: python
    plan: starter
    region: ohio
    branch: main
    schedule: "15 4 * * *"
    buildCommand: pip install -r requirements.txt
    # 102 segments x up to 10 pages each = 1,020 requests worst case; 1,100
    # leaves a little slack for a retried page without letting a runaway
    # config burn the month. At a daily cadence that is ~30,600 requests of
    # the Starter plan's 50,000, leaving room for live scan-time lookups.
    # The old cap of 120 predates the expanded segment list and would now
    # truncate the run around the 12th segment, silently skipping every
    # brand after it.
    startCommand: python -m scripts.backfill_kicksdb_catalog --max-requests 1100 --catalog-batch-size 100
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: ENVIRONMENT
        value: sit
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: KICKSDB_API_KEY
        sync: false

  # Daily refresh for the 5 pricecharting.com registry categories that are
  # already 100% backfilled (coins, comic-books, funko-pops, lego-sets,
  # lorcana-cards -- ~6,600 sets total) but permanently excluded from
  # backfill-pricecharting-sets-sit's claim_rows() once successful. Unlike
  # sportscardspro.com's categories (still mid first-pass, heavily
  # throttled), these are small and completely unthrottled, so rather than
  # complicate the shared claim/priority-tier logic sportscardspro depends
  # on, this is a standalone script: unconditionally re-downloads every set
  # in these categories daily via its saved console_uid. ~44 download-custom
  # requests/run (6,600 sets / 150 per batch) -- a couple minutes, not the
  # multi-day sportscardspro backfill problem.
  - type: cron
    name: packlox-refresh-completed-pricecharting-categories-sit
    runtime: python
    plan: starter
    region: ohio
    branch: main
    schedule: "45 4 * * *"
    buildCommand: pip install -r requirements.txt
    startCommand: python -m scripts.refresh_completed_pricecharting_categories --batch-size 150 --catalog-batch-size 500 --sleep-between-requests-seconds 2
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: ENVIRONMENT
        value: sit
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: PRICECHARTING_API_TOKEN
        sync: false

  # TEMPORARY / diagnostic only: exists purely to get Shell access to a
  # different Render region (Ohio, vs. the Oregon used everywhere else) so
  # we can test whether sportscardspro.com's Cloudflare block is scoped to
  # our specific Oregon outbound IP or to Render's ASN as a whole. Schedule
  # is set far in the future -- this cron is never meant to actually run;
  # only its Shell tab gets used. Safe to delete once the test is done.
  - type: cron
    name: packlox-region-test-ohio-sit
    runtime: python
    plan: starter
    region: ohio
    branch: main
    schedule: "0 0 1 1 *"
    buildCommand: pip install -r requirements.txt
    startCommand: python3 -c "pass"

  # App-facing: fetch today's USD-base FX rates (Frankfurter/ECB, free, no
  # key) and store them in fx_rates_daily. Runs once a day -- currency
  # doesn't move fast enough for collectibles to need anything more real-time.
  # get_rate()'s "most recent earlier date" fallback covers a missed run or
  # a non-trading day, so this doesn't need to run without fail.
  - type: cron
    name: packlox-fx-rates-refresh-sit
    runtime: python
    plan: starter
    region: oregon
    branch: main
    schedule: "0 3 * * *"
    buildCommand: pip install -r requirements.txt
    startCommand: curl -fsS -X POST "https://api-sit.packlox.com/admin/pricing/fx-rates/refresh" -H "X-Admin-Token: $ADMIN_JOB_TOKEN"
    envVars:
      - key: ADMIN_JOB_TOKEN
        sync: false

  # App-facing: batch re-price every portfolio item (persist refreshed values).
  # Calls the deployed web service, which owns all the pricing env; the endpoint
  # no-ops safely while PRICING_PROVIDER=mock (never zeroes existing values).
  # Runs after the PriceCharting catalog refresh (14:30) so it prices fresh data.
  #
  # NOTE: if this cron instead runs the standalone script
  #   python -m scripts.run_batch_repricing --limit 5000 --page-size 200
  # then it needs the FULL pricing env (SUPABASE_*, PRICING_PROVIDER=auto,
  # PRICECHARTING_API_KEY, EBAY_*, KICKSDB_*) on the cron itself.
  - type: cron
    name: packlox-batch-reprice-sit
    runtime: python
    plan: starter
    region: oregon
    branch: main
    schedule: "0 16 * * *"
    buildCommand: pip install -r requirements.txt
    # URL hardcoded (not $PUBLIC_API_URL) — the env var wasn't reliably present
    # on the cron, so curl got an empty host and failed with "(3) bad/illegal URL".
    startCommand: curl -fsS -X POST "https://api-sit.packlox.com/admin/pricing/reprice-all?limit=5000" -H "X-Admin-Token: $ADMIN_JOB_TOKEN"
    envVars:
      - key: ADMIN_JOB_TOKEN
        sync: false

  # App-facing: evaluate saved price alerts (flip -> triggered) + dispatch pushes.
  # /admin/push/price-alerts/run does evaluate + dispatch in one call.
  #
  # NOTE: standalone-script alternative
  #   python -m scripts.run_price_alert_pipeline --limit 1000 --push-limit 200
  # needs SUPABASE_* + FIREBASE_* on the cron itself.
  - type: cron
    name: packlox-price-alerts-sit
    runtime: python
    plan: starter
    region: oregon
    branch: main
    schedule: "0 */6 * * *"
    buildCommand: pip install -r requirements.txt
    startCommand: curl -fsS -X POST "https://api-sit.packlox.com/admin/push/price-alerts/run?limit=200" -H "X-Admin-Token: $ADMIN_JOB_TOKEN"
    envVars:
      - key: ADMIN_JOB_TOKEN
        sync: false

  # App-facing: promote corroborated scan-derived pricing_cache_entries rows
  # (KicksDB/TCGPlayer/eBay results from real scans) into pricecharting_catalog,
  # so Discover's search can surface categories no CSV import covers (Sneakers,
  # Comics, Coins, etc.) — see docs/GLOBAL_CATALOG_ARCHITECTURE.md. minHitCount=1
  # requires at least one independent corroborating scan beyond the original
  # before anything is promoted. dryRun=false — a no-op cron would defeat the
  # point; the corroboration threshold is the safety gate, not dry-run mode.
  # Uses ADMIN_IMPORT_TOKEN (not ADMIN_JOB_TOKEN) — this endpoint reuses the
  # same auth dependency as /admin/pricecharting/import.
  #
  # NOTE: standalone-script alternative would call
  #   promote_scan_derived_rows() directly and needs SUPABASE_* on the cron
  #   itself instead of ADMIN_IMPORT_TOKEN.
  - type: cron
    name: packlox-catalog-promote-scan-derived-sit
    runtime: python
    plan: starter
    region: oregon
    branch: main
    schedule: "0 17 * * *"
    buildCommand: pip install -r requirements.txt
    startCommand: curl -fsS -X POST "https://api-sit.packlox.com/admin/catalog/promote-scan-derived?dryRun=false&minHitCount=1" -H "X-Admin-Token: $ADMIN_IMPORT_TOKEN"
    envVars:
      - key: ADMIN_IMPORT_TOKEN
        sync: false

  # App-facing: links portfolio_items to their matched pricecharting_catalog
  # row (via the existing search_pricecharting_catalog RPC, confidence>=0.90
  # only -- prefix/exact/product-name-substring matches, never a loose
  # console/category-only guess) so the reprice cron can read a price
  # straight from the catalog instead of always calling a live pricing
  # provider API. Covers both new items (queue ordered so never-attempted
  # items go first) and a retroactive backfill of already-owned items with
  # the same job. Cheap (internal Supabase reads/writes only, no external
  # rate limits), so it runs hourly rather than daily.
  - type: cron
    name: packlox-match-portfolio-catalog-sit
    runtime: python
    plan: starter
    region: oregon
    branch: main
    schedule: "0 * * * *"
    buildCommand: pip install -r requirements.txt
    startCommand: curl -fsS -X POST "https://api-sit.packlox.com/admin/portfolio/match-catalog?dryRun=false&limit=500" -H "X-Admin-Token: $ADMIN_JOB_TOKEN"
    envVars:
      - key: ADMIN_JOB_TOKEN
        sync: false
